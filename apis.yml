name: MEDICAL INTELLIGENCE CO
description: >-
  Medicarri (operated by Medical Intelligence Co) is a B2B healthtech marketplace based in Riyadh,
  Saudi Arabia that connects clinics and healthcare facilities with medical suppliers, letting buyers
  source medical supplies and equipment from many vendors in one place. The company was selected for
  Batch 4 of the Sanabil 500 MENA Seed Accelerator Program run by 500 Global and Sanabil Investments.
  As of this profile Medicarri operates a customer-facing e-commerce web application at medicarri.com
  and does not publish a public developer API, OpenAPI specification, or developer portal.
